<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Friend or Foe co-op research preview</title>
  <desc id="desc">An original abstract diagram of two independent English and Russian clients sharing a synchronized input stream.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2e"/><stop offset="1" stop-color="#172943"/></linearGradient>
    <linearGradient id="wire"><stop stop-color="#53d7c1"/><stop offset="1" stop-color="#8bacff"/></linearGradient>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <g fill="none" stroke="#324866" opacity=".5">
    <path d="M0 210H1200M0 230H1200M0 250H1200"/>
    <path d="M735 0V280M815 0V280M895 0V280M975 0V280M1055 0V280M1135 0V280"/>
  </g>
  <text x="54" y="65" fill="#85a9cd" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">SOURCE RESEARCH PREVIEW</text>
  <text x="54" y="116" fill="#f2f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">FRIEND OR FOE</text>
  <text x="54" y="157" fill="#f2f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="28">Two native clients. Shared actions.</text>
  <rect x="54" y="194" width="202" height="33" rx="16" fill="#263b55"/>
  <text x="72" y="216" fill="#c6d7eb" font-family="Segoe UI,Arial,sans-serif" font-size="13">ACTIVE DEVELOPMENT</text>
  <g stroke-width="2" font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <rect x="722" y="77" width="154" height="121" rx="13" fill="#132f3a" stroke="#53d7c1"/>
    <rect x="981" y="77" width="154" height="121" rx="13" fill="#202d4b" stroke="#8bacff"/>
    <text x="799" y="119" fill="#b9f7ed" font-size="14">CLIENT A</text>
    <text x="799" y="161" fill="#f2f6ff" font-size="26" font-weight="600">EN</text>
    <text x="1058" y="119" fill="#c7d6ff" font-size="14">CLIENT B</text>
    <text x="1058" y="161" fill="#f2f6ff" font-size="26" font-weight="600">RU</text>
    <path d="M876 129H981M876 148H981" stroke="url(#wire)"/>
    <circle cx="911" cy="129" r="4" fill="#53d7c1"/>
    <circle cx="946" cy="148" r="4" fill="#8bacff"/>
  </g>
</svg>
